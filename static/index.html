<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TachiDUBB Studio</title>
<link rel="stylesheet" href="/static/fonts.css">
<style>
  :root {
    --bg: #0a0a0d;
    --bg-1: #101014;
    --bg-2: #16161c;
    --bg-3: #1d1d25;
    --line: #24242e;
    --line-2: #2f2f3c;
    --ink: #ece9e0;
    --ink-2: #a3a096;
    --ink-3: #5a5a63;
    --ink-4: #35353d;
    --accent: oklch(0.88 0.18 125);
    --accent-dim: oklch(0.88 0.18 125 / 0.15);
    --accent-glow: oklch(0.88 0.18 125 / 0.4);
    --warn: oklch(0.78 0.15 60);
    --err: oklch(0.7 0.2 25);
    --serif: 'Titillium Web', ui-sans-serif, system-ui, sans-serif;
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  #root { width: 100vw; height: 100vh; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; letter-spacing: inherit; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; background: transparent; border: none; outline: none; }

  .serif { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: -0.01em; }
  .caps { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  /* Noise overlay — Tachi signature */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    z-index: 9999;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.8'/%3E%3C/svg%3E");
  }

  .three-canvas { width: 100%; height: 100%; display: block; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-1);
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-2); color: var(--ink); background: var(--bg-2); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); color: var(--ink-2); background: var(--bg-1); }
  .btn-primary {
    background: var(--accent);
    color: #0a0a0d;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover { filter: brightness(1.1); border-color: var(--accent); color: #0a0a0d; background: var(--accent); }
  .btn-primary:disabled { background: var(--bg-2); color: var(--ink-3); border-color: var(--line); }
  .btn-primary:disabled:hover { filter: none; }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { border-color: var(--line); background: var(--bg-1); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-1);
    color: var(--ink-2);
    font-size: 11px;
    font-weight: 500;
  }
  .chip.accent { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); }

  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .panel { background: var(--bg-1); border: 1px solid var(--line); border-radius: 10px; }

  .field {
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    transition: border-color 0.12s;
    width: 100%;
    font-size: 12.5px;
  }
  .field:hover { border-color: var(--line-2); }
  .field:focus { border-color: var(--accent); }

  .tab {
    padding: 8px 2px;
    color: var(--ink-3);
    font-size: 12px;
    font-weight: 500;
    border-bottom: 1px solid transparent;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  .scroll { overflow-y: auto; overflow-x: hidden; }
  .scroll::-webkit-scrollbar { width: 4px; }

  /* Drop zone for file upload */
  .dropzone {
    border: 1px dashed var(--line-2);
    border-radius: 10px;
    padding: 28px 20px;
    text-align: center;
    background: var(--bg-1);
    cursor: pointer;
    transition: all 0.15s;
  }
  .dropzone:hover { border-color: var(--accent-dim); background: var(--bg-2); }
  .dropzone.dragging { border-color: var(--accent); background: var(--accent-dim); }
</style>
</head>
<body>
<div id="root"></div>

<script src="/static/dist/app.js" defer></script>
</body>
</html>
